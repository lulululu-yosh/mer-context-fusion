experiment:
  name: exp001_text_roberta_utt
  seed: 42
  output_dir: experiments/exp001_text_roberta_utt

data:
  train_file: data/processed/train.jsonl
  dev_file: data/processed/dev.jsonl
  test_file: data/processed/test.jsonl
  text_field: text
  label_field: label
  context_window: 0

model:
  type: text_classifier
  encoder_name: roberta-base
  num_labels: 7
  dropout: 0.1

training:
  batch_size: 16
  epochs: 5
  lr: 2.0e-5
  weight_decay: 0.01
  max_length: 128
  gradient_accumulation_steps: 1

evaluation:
  metrics:
    - accuracy
    - macro_f1
    - weighted_f1
